services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: foxpeople
      POSTGRES_USER: foxpeople
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bitte-aendern}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxpeople"]
      interval: 10s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://foxpeople:${DB_PASSWORD:-bitte-aendern}@db:5432/foxpeople
      FILE_STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    healthcheck:
      # Bewusst mit Node statt wget/curl: Im schlanken Node-Image ist keines von beiden garantiert
      # vorhanden, und "localhost" löst im Container zuerst auf ::1 auf, während Next auf IPv4
      # lauscht – beides führt zu einem "unhealthy", obwohl die Software einwandfrei läuft.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
  # Stündlicher Hintergrundlauf: Fristen, Wiedervorlagen, Wochen-Erinnerung, Aufräumen.
  # Ohne ihn liefe das nur, wenn im Büro jemand das Dashboard öffnet.
  lauf:
    image: alpine:3
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    # Beim Start ein paar Anläufe: die Anwendung braucht nach einem Update eine Minute zum Hochfahren,
    # sonst geht der erste Lauf ins Leere und die Fristen werden erst eine Stunde später berechnet.
    entrypoint: ["sh", "-c", "apk add --no-cache curl >/dev/null 2>&1; while true; do n=0; until curl -fsS -m 120 -H \"x-lauf-token: $$LAUF_TOKEN\" http://app:3000/api/lauf >/dev/null 2>&1; do n=$$((n+1)); [ $$n -ge 10 ] && { echo \"Lauf fehlgeschlagen $$(date -Iseconds)\"; break; }; sleep 15; done; sleep 3600; done"]
  # Tägliche Sicherung: lokal auf dem Server UND – sobald eingerichtet – verschlüsselt auf eine
  # zweite Maschine (Hetzner Storage Box). Eine Kopie neben dem Original hilft nur gegen Versehen,
  # nicht gegen Plattenschaden, falsche Befehle oder einen Einbruch auf dem Server.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      PGPASSWORD: ${DB_PASSWORD:-bitte-aendern}
    volumes:
      - ./backups:/backups
      - ./schluessel:/schluessel:ro
      - storage:/storage:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
volumes:
  dbdata:
  storage:
  caddydata:
  caddyconfig:
